name: 烟草比价监控

on:
  workflow_dispatch: # 仅支持手动/外部API触发(cron-job.org 定时调用 GitHub API)

# 允许 workflow 用默认 GITHUB_TOKEN 推送 state.json 回仓库
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 编译 TypeScript
        run: npm run build

      - name: 运行监控
        env:
          QY_WECHAT_WEBHOOK: ${{ secrets.QY_WECHAT_WEBHOOK }}
        run: node dist/index.js

      - name: 持久化 state.json(若有变化)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet state.json; then
            echo "state.json 未变化,跳过提交"
          else
            git add state.json
            git commit -m "chore: 更新监控状态快照 [skip ci]"
            git push
            echo "state.json 已提交"
          fi
